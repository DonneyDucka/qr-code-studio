<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f4f1ea"/>

  <!-- faint module grid, subject-derived texture -->
  <g fill="#17160f" opacity="0.05">
    <!-- generated columns of small squares -->
    <g>
      <rect x="60" y="60" width="7" height="7"/><rect x="90" y="60" width="7" height="7"/><rect x="150" y="60" width="7" height="7"/>
      <rect x="60" y="90" width="7" height="7"/><rect x="120" y="90" width="7" height="7"/><rect x="180" y="90" width="7" height="7"/>
    </g>
  </g>

  <!-- brand mark -->
  <g transform="translate(80,90)">
    <rect width="76" height="76" rx="16" fill="#17160f"/>
    <rect x="12" y="12" width="19" height="19" rx="5" fill="#f4f1ea"/><rect x="18" y="18" width="7" height="7" fill="#17160f"/>
    <rect x="45" y="12" width="19" height="19" rx="5" fill="#e5361b"/><rect x="51" y="18" width="7" height="7" fill="#17160f"/>
    <rect x="12" y="45" width="19" height="19" rx="5" fill="#f4f1ea"/><rect x="18" y="51" width="7" height="7" fill="#17160f"/>
    <rect x="45" y="45" width="8" height="8" fill="#f4f1ea"/><rect x="56" y="56" width="8" height="8" fill="#e5361b"/>
  </g>
  <text x="176" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#57534a" letter-spacing="1">QR Code Studio</text>

  <!-- headline (Fraunces approximated with serif for the scraper) -->
  <text x="80" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="500" fill="#17160f" letter-spacing="-2">Beautiful QR codes,</text>
  <text x="80" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="500" fill="#17160f" letter-spacing="-2">built like <tspan fill="#e5361b" font-style="italic">print.</tspan></text>

  <text x="82" y="512" font-family="'Courier New', monospace" font-size="24" fill="#57534a" letter-spacing="2">LOGOS &#183; GRADIENTS &#183; SVG &#183; FREE &amp; PRIVATE</text>
</svg>
